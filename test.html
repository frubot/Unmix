<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Unmix テストトーン</title>
<style>
  body { font: 14px/1.6 "Segoe UI", "Yu Gothic UI", sans-serif; background: #16181d; color: #e6e6e6; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  p { color: #9aa3b5; }
  button { background: #262b36; color: #dfe4ee; border: 1px solid #353c4b; border-radius: 6px; padding: 8px 14px; margin: 4px 6px 4px 0; cursor: pointer; font-size: 13px; }
  button:hover { background: #313949; }
  #status { margin-top: 16px; font-size: 24px; font-weight: 700; letter-spacing: 2px; min-height: 32px; }
  #status.L { color: #8ff0b3; } #status.R { color: #7aa2ff; }
  code { background: #262b36; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Unmix テストトーン</h1>
<p>
  このタブを Unmix でキャプチャ → パンを動かすと、このタブの音が全部その耳に寄るのが確認できる。<br>
  手順例: <code>交互ビープ</code>を鳴らす → 拡張機能でこのタブを L に → 左耳からしか聞こえなくなればOK。<br>
  さらに別タブ(YouTubeとか)を R にすると、左右で別々の音声になる。
</p>
<button id="bLeft">左だけビープ</button>
<button id="bRight">右だけビープ</button>
<button id="bAlt">交互ビープ 開始</button>
<button id="bStop">停止</button>
<div id="status"></div>
<script>
let ctx = null, timer = null, left = true;
const status = document.getElementById('status');

function beep(pan) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const p = ctx.createStereoPanner();
  o.frequency.value = pan < 0 ? 440 : 880;
  p.pan.value = pan;
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(p); p.connect(ctx.destination);
  o.start(t); o.stop(t + 0.4);
  status.textContent = pan < 0 ? 'LEFT' : 'RIGHT';
  status.className = pan < 0 ? 'L' : 'R';
}

function ensureCtx() {
  if (!ctx) ctx = new AudioContext();
  ctx.resume();
}

document.getElementById('bLeft').onclick = () => { ensureCtx(); beep(-1); };
document.getElementById('bRight').onclick = () => { ensureCtx(); beep(1); };
document.getElementById('bAlt').onclick = () => {
  ensureCtx();
  clearInterval(timer);
  left = true;
  timer = setInterval(() => { beep(left ? -1 : 1); left = !left; }, 700);
};
document.getElementById('bStop').onclick = () => { clearInterval(timer); timer = null; status.textContent = ''; };
</script>
</body>
</html>
