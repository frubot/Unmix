<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Unmix テストトーン</title>
<style>
  body { font: 14px/1.6 "Segoe UI", "Yu Gothic UI", sans-serif; background: #16181d; color: #e6e6e6; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  h2 { font-size: 15px; margin-top: 32px; }
  p { color: #9aa3b5; }
  button { background: #262b36; color: #dfe4ee; border: 1px solid #353c4b; border-radius: 6px; padding: 8px 14px; margin: 4px 6px 4px 0; cursor: pointer; font-size: 13px; }
  button:hover { background: #313949; }
  #status { margin-top: 16px; font-size: 24px; font-weight: 700; letter-spacing: 2px; min-height: 32px; }
  #status.L { color: #8ff0b3; } #status.R { color: #7aa2ff; }
  code { background: #262b36; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Unmix テストトーン</h1>
<p>
  このタブを Unmix でキャプチャ → パンを動かすと、このタブの音が全部その耳に寄るのが確認できる。<br>
  手順例: <code>交互ビープ</code>を鳴らす → 拡張機能でこのタブを L に → 左耳からしか聞こえなくなればOK。<br>
  さらに別タブ(YouTubeとか)を R にすると、左右で別々の音声になる。
</p>
<button id="bLeft">左だけビープ</button>
<button id="bRight">右だけビープ</button>
<button id="bAlt">交互ビープ 開始</button>
<button id="bStop">停止</button>

<h2>ASMR モード確認用</h2>
<p>
  このページを2つ開き、片方で<code>ささやき風ノイズ</code>、もう片方で<code>連続トーン</code>を鳴らす。<br>
  Unmix の ASMR モードでノイズ側を「囁き」、トーン側を「追従」にすると、トーンがノイズと逆側へ動く。
</p>
<button id="bWhisper">ささやき風ノイズ</button>
<button id="bTone">連続トーン</button>
<div id="status"></div>
<script>
let ctx = null, timer = null, left = true;
const status = document.getElementById('status');

function beep(pan) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const p = ctx.createStereoPanner();
  o.frequency.value = pan < 0 ? 440 : 880;
  p.pan.value = pan;
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(p); p.connect(ctx.destination);
  o.start(t); o.stop(t + 0.4);
  status.textContent = pan < 0 ? 'LEFT' : 'RIGHT';
  status.className = pan < 0 ? 'L' : 'R';
}

function ensureCtx() {
  if (!ctx) ctx = new AudioContext();
  ctx.resume();
}

document.getElementById('bLeft').onclick = () => { ensureCtx(); beep(-1); };
document.getElementById('bRight').onclick = () => { ensureCtx(); beep(1); };
document.getElementById('bAlt').onclick = () => {
  ensureCtx();
  stopAll();
  left = true;
  timer = setInterval(() => { beep(left ? -1 : 1); left = !left; }, 700);
};
let extra = [];

function stopAll() {
  clearInterval(timer);
  timer = null;
  extra.forEach((n) => { try { n.stop(); } catch (e) {} });
  extra = [];
  status.textContent = '';
}

// Band-limited noise bursts (phrases with pauses) that sweep L <-> R every 8 s.
function startWhisper() {
  ensureCtx();
  stopAll();
  const len = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 4000;
  bp.Q.value = 0.8;
  const g = ctx.createGain();
  g.gain.value = 0;
  const p = ctx.createStereoPanner();
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 1 / 8;
  src.connect(bp); bp.connect(g); g.connect(p); p.connect(ctx.destination);
  lfo.connect(p.pan);
  src.start(); lfo.start();
  extra = [src, lfo];
  const phrase = () => {
    const t = ctx.currentTime;
    g.gain.setTargetAtTime(0.25, t, 0.05);
    g.gain.setTargetAtTime(0, t + 1.2, 0.08);
  };
  phrase();
  timer = setInterval(phrase, 1700);
  status.textContent = 'WHISPER';
  status.className = '';
}

function startTone() {
  ensureCtx();
  stopAll();
  const g = ctx.createGain();
  g.gain.value = 0.08;
  g.connect(ctx.destination);
  extra = [220, 277.2, 329.6].map((f) => {
    const o = ctx.createOscillator();
    o.frequency.value = f;
    o.connect(g);
    o.start();
    return o;
  });
  status.textContent = 'TONE';
  status.className = '';
}

document.getElementById('bStop').onclick = stopAll;
document.getElementById('bWhisper').onclick = startWhisper;
document.getElementById('bTone').onclick = startTone;
</script>
</body>
</html>
